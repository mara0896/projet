{% extends "layout.html" %}

{% block content %}
    <h1>Manage games</h1>

    <a href="{{ url_for('admin_games.create_game') }}">
        Create game
    </a>

    {% for game in games %}
        <article>
            <h2>{{ game.name }}</h2>
            <p>Slug: {{ game.slug }}</p>
            <p>Active: {{ game.is_active }}</p>

            <a href="{{ url_for(
                'admin_games.edit_game',
                game_id=game.id
            ) }}">
                Edit
            </a>

            <form method="post" action="{{ url_for(
                'admin_games.delete_game',
                game_id=game.id
            ) }}">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >
                <button type="submit">Delete</button>
            </form>
        </article>
    {% else %}
        <p>No games found.</p>
    {% endfor %}
{% endblock %}
